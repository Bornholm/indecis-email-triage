version: 2

env:
  - CGO_ENABLED=0
  # Portable SIMD, as for indecis: several times faster.
  - GOEXPERIMENT=simd

builds:
  - id: indecis-mail
    goos: [linux]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    main: ./cmd/indecis-mail
    binary: indecis-mail
    flags:
      - -trimpath
    ldflags:
      - -w -s

archives:
  - formats: [tar.gz]
    files:
      - LICENSE.md
      - README.md
      - config.example.yaml

nfpms:
  - id: indecis-mail
    package_name: indecis-mail
    ids: [indecis-mail]
    formats: [deb, rpm, archlinux]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Bornholm
    homepage: https://github.com/Bornholm/indecis-email-triage
    maintainer: William Petit <william.petit@ptitcloud.fr>
    description: |-
      Sorts the emails of an IMAP mailbox among categories described in a
      YAML file, with a small indecis model running locally.
    license: GPL-3.0-only
    section: mail
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/indecis-mail/README.md
      - src: config.example.yaml
        dst: /usr/share/doc/indecis-mail/config.example.yaml
      - src: LICENSE.md
        dst: /usr/share/licenses/indecis-mail/LICENSE.md
    archlinux:
      packager: William Petit <william.petit@ptitcloud.fr>

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  name_template: "v{{ .Version }}"
